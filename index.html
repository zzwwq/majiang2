    <title>浦城麻将 - 单机人机对战</title>
    <style>
        :root {
            --bg-color: #050d08;
            --table-felt: #114b2d;
            --table-felt-inner: #0d3a22;
            --table-border: #1c110a;
            --tile-bg: linear-gradient(180deg, #ffffff 0%, #f4efe2 80%, #dfd3bd 100%);
            --tile-back-green: linear-gradient(180deg, #27ae60 0%, #1e824c 100%);
            --accent-gold: #f39c12;
            --danger-red: #e74c3c;
            --btn-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Kaiti SC", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app {
            width: 100vw;
            height: 100vh;
            max-width: 1366px;
            max-height: 850px;
            background-color: #071910;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        .header {
            height: 46px;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 14px;
            z-index: 30;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .header-title {
            font-weight: bold;
            font-size: 16px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, button {
            background: #1c3024;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        select:hover, button:hover {
            background: #2a4736;
            border-color: var(--accent-gold);
        }

        .btn-gold {
            background: linear-gradient(180deg, #f39c12, #d35400);
            color: #fff;
            font-weight: bold;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .btn-gold:hover {
            background: linear-gradient(180deg, #f1c40f, #e67e22);
        }

        .mahjong-table {
            flex: 1;
            background: radial-gradient(circle at center, var(--table-felt) 0%, var(--table-felt-inner) 75%, #061c10 100%);
            border: 12px solid var(--table-border);
            position: relative;
            display: grid;
            grid-template-rows: 68px minmax(0, 1fr) 160px;
            grid-template-columns: 110px minmax(0, 1fr) 110px;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        .player-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 25;
            transition: border-color 0.3s, box-shadow 0.3s;
            position: relative;
            cursor: pointer;
        }
        .player-info.active {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px var(--accent-gold);
        }
        .player-score {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 11px;
        }

        .dealer-badge {
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
            margin-left: 4px;
            border: 1px solid #f1c40f;
            display: inline-block;
        }

        /* 需求1: 南北头像移到左侧，让手牌行有更多纵向空间 */
        .area-north { grid-row: 1; grid-column: 2; flex-direction: row; justify-content: center; align-items: center; gap: 8px; padding: 4px 10px 0; }
        .area-north > .player-info { flex-shrink: 0; }
        .area-north > div:last-child { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* 需求2: 东西家碰杠与手牌墙分区，碰杠多了换行不挤手牌。
           容器用 grid（三行: 头像/碰杠/手牌墙）而非 flex——WebKit(Safari) 对
           "flex伸缩高度+列向wrap"不重新折行（只显示一列的根因），
           grid 行高是真正确定的高度，手牌墙折行在全浏览器可靠。 */
        .area-west { grid-row: 2; grid-column: 1; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); justify-items: center; row-gap: 8px; overflow: hidden; }
        .area-east { grid-row: 2; grid-column: 3; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); justify-items: center; row-gap: 8px; overflow: hidden; }
        .area-west > .player-info, .area-east > .player-info { flex-shrink: 0; justify-self: center; }
        .area-west .melds-container, .area-east .melds-container { max-height: 120px; overflow: hidden; flex-wrap: wrap; align-content: flex-start; justify-content: center; justify-self: center; }
        .area-west .side-tile-wall, .area-east .side-tile-wall { width: 100%; min-height: 0; height: 100%; overflow: hidden; align-content: center; }
        /* 东西两侧碰/杠牌：缩小牌面让杠牌(4张)整行放下列宽内，多组碰杠竖向换行完整显示 */
        .area-west .meld-group, .area-east .meld-group { padding: 1px; gap: 1px; }
        .area-west .meld-group .tile.small, .area-east .meld-group .tile.small { width: 24px; height: 32px; border-radius: 3px; }
        .area-west .meld-group .tile.small .tile-num, .area-east .meld-group .tile.small .tile-num { font-size: 12px; line-height: 1; }
        .area-west .meld-group .tile.small .tile-char, .area-east .meld-group .tile.small .tile-char { font-size: 9px; line-height: 1; }

        .area-south { grid-row: 3; grid-column: 1 / span 3; flex-direction: column; justify-content: flex-end; align-items: center; padding: 0 8px 6px; z-index: 20; position: relative; }
        .area-south > .player-info { position: absolute; left: 10px; bottom: 8px; z-index: 26; }

        .area-center {
            grid-row: 2;
            grid-column: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .center-board {
            width: 210px;
            min-height: 135px;
            max-height: 100%;
            overflow: hidden;
            padding: 8px;
            background: #092416;
            border-radius: 10px;
            border: 3px solid #1a6e3d;
            display: flex;

        .side-tile {

        .tile[data-suit="wan"] .tile-num, .tile[data-suit="wan"] .tile-char { color: #d32f2f; }

        }

        .drawn-tile-gap { margin-left: 16px !important; }
        .side-drawn-tile-gap { margin-top: 10px !important; }

        .action-bar {
            position: absolute;
            bottom: 145px;
            right: 28px;
            display: flex;
            gap: 12px;
            z-index: 35;
        }

        .action-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f39c12, #d35400);

        .log-item {

            border-left: 3px solid var(--accent-gold);

        /* ===== 手机自适应：用 vmin/vw 让桌面与手牌按视口缩放，不再被固定 px 卡住 ===== */
        @media (max-width: 768px) {
            #app { max-width: 100%; max-height: 100%; }
            .header { height: 38px; padding: 0 8px; font-size: 12px; }
            .header-title { font-size: 13px; gap: 4px; }
            .controls-group { gap: 6px; }
            select, button { font-size: 11px; padding: 3px 6px; }

            /* 行列用 vmin：横竖屏都按短边比例缩放，避免固定 px 在小屏挤压截断 */
            .mahjong-table {
                grid-template-rows: minmax(66px, 17vmin) minmax(0, 1fr) minmax(112px, 25vmin);
                grid-template-columns: minmax(44px, 11vmin) minmax(0, 1fr) minmax(44px, 11vmin);
                border-width: 6px;
            }
            .center-board { width: min(46vmin, 240px); min-height: min(30vmin, 130px); padding: 6px; gap: 3px; }
            .turn-indicator { font-size: 12px; }
            .action-announcement { font-size: 11px; padding: 3px 6px; }

            /* 手牌：用 vw 自适应宽度，竖屏 14 张也能横排放下 */
            .hand-tiles { gap: 2px; padding: 2px 4px; }
            .area-south .hand-tiles .tile {
                width: clamp(22px, 6.2vw, 44px);
                height: clamp(34px, 9.4vw, 66px);
                border-bottom-width: 4px;
            }
            .area-south .hand-tiles .tile .tile-num { font-size: clamp(13px, 3vw, 22px); }
            .area-south .hand-tiles .tile .tile-char { font-size: clamp(8px, 1.6vw, 12px); margin-top: 1px; }
            .area-south .hand-tiles .tile.selected { transform: translateY(-14px); }
            .drawn-tile-gap { margin-left: 10px !important; }

            .action-bar { bottom: min(118px, 26vmin); right: 8px; gap: 8px; }
            .action-btn { width: 44px; height: 44px; font-size: 12px; }
            .action-btn.hu { font-size: 14px; }

            .discards-grid { max-width: min(40vmin, 280px); }
            .player-info { font-size: 10px; padding: 3px 6px; gap: 4px; }
            .player-score { font-size: 10px; }
            .dealer-badge { font-size: 9px; }
            .side-tile { width: 16px; height: 22px; }
            .tile.back-top { width: 22px; height: 30px; }
            .tile.small { width: 20px; height: 27px; }
            .tile.small .tile-num { font-size: 10px; }
            .tile.small .tile-char { font-size: 8px; }
            .area-west .melds-container, .area-east .melds-container { max-height: 96px; }
            .area-west .meld-group .tile.small, .area-east .meld-group .tile.small { width: 18px; height: 24px; }
            .area-west .meld-group .tile.small .tile-num, .area-east .meld-group .tile.small .tile-num { font-size: 10px; }
            .area-west .meld-group .tile.small .tile-char, .area-east .meld-group .tile.small .tile-char { font-size: 7px; }
            .area-west .player-info, .area-east .player-info { padding: 2px 4px; gap: 3px; }
            .area-west .player-info .avatar, .area-east .player-info .avatar { width: 20px; height: 20px; font-size: 11px; }
            .modal-card { width: 94%; padding: 14px; }
            .modal-header { font-size: 15px; }
            .modal-body { font-size: 12px; max-height: 60vh; }
        }

        /* ===== 横屏矮屏（手机横屏：宽度可能 >768 但高度矮）=====
           按短边 vmin 自适应，保证整桌完整可见；iPad/桌面(高度>560)不受影响 */
        @media (orientation: landscape) and (max-height: 560px) {
            #app { max-width: 100%; max-height: 100%; }
            .header { height: 36px; padding: 0 8px; font-size: 12px; }
            .header-title { font-size: 13px; gap: 4px; }
            .controls-group { gap: 6px; }
            select, button { font-size: 11px; padding: 3px 6px; }

            .mahjong-table {
                grid-template-rows: minmax(66px, 17vmin) minmax(0, 1fr) minmax(102px, 25vmin);
                grid-template-columns: minmax(70px, 14vmin) minmax(0, 1fr) minmax(70px, 14vmin);
                border-width: 6px;
            }
            .center-board { width: min(46vmin, 220px); min-height: min(27vmin, 104px); padding: 5px; gap: 3px; }
            .turn-indicator { font-size: 11px; }
            .action-announcement { font-size: 10px; padding: 3px 6px; }

            .hand-tiles { gap: 2px; padding: 2px 4px; }
            .area-south .hand-tiles .tile {
                width: clamp(20px, 6vw, 40px);
                height: clamp(30px, 9vw, 60px);
                border-bottom-width: 4px;
            }
            .area-south .hand-tiles .tile .tile-num { font-size: clamp(12px, 2.8vw, 20px); }
            .area-south .hand-tiles .tile .tile-char { font-size: clamp(8px, 1.5vw, 11px); margin-top: 1px; }
            .area-south .hand-tiles .tile.selected { transform: translateY(-12px); }
            .drawn-tile-gap { margin-left: 10px !important; }

            .action-bar { bottom: min(106px, 24vmin); right: 8px; gap: 8px; }
            .action-btn { width: 42px; height: 42px; font-size: 12px; }
            .action-btn.hu { font-size: 14px; }

            .discards-grid { max-width: min(40vmin, 140px); }
            .player-info { font-size: 10px; padding: 3px 6px; gap: 4px; }
            .player-score { font-size: 10px; }
            .dealer-badge { font-size: 9px; }
            .side-tile { width: 14px; height: 18px; }
            .tile.back-top { width: 21px; height: 29px; }
            .tile.small { width: 19px; height: 26px; }
            .tile.small .tile-num { font-size: 10px; }
            .tile.small .tile-char { font-size: 8px; }
            .area-west .melds-container, .area-east .melds-container { max-height: 80px; }
            .area-west .meld-group .tile.small, .area-east .meld-group .tile.small { width: 15px; height: 18px; border-radius: 2px; }
            .area-west .meld-group .tile.small .tile-num, .area-east .meld-group .tile.small .tile-num { font-size: 9px; }
            .area-west .meld-group .tile.small .tile-char, .area-east .meld-group .tile.small .tile-char { font-size: 6px; }
            /* 手机横屏：东西头像只留头像圆点，隐藏名字/积分文字，释放纵向空间给手牌墙 */
            .area-west .player-info, .area-east .player-info { padding: 2px; gap: 0; flex-direction: column; align-items: center; background: rgba(0,0,0,0.55); }
            .area-west .player-info > div:not(.avatar), .area-east .player-info > div:not(.avatar) { display: none; }
            .area-west .player-info .avatar, .area-east .player-info .avatar { width: 20px; height: 20px; font-size: 11px; border-width: 1px; }
            .modal-card { width: 94%; padding: 12px; }
            .modal-header { font-size: 15px; }
            .modal-body { font-size: 12px; max-height: 60vh; }
        }

        /* ===== 更矮的横屏(高度≤400，如 640×360/568×320)：手牌墙再缩小，13 张在列内完整显示 ===== */
        @media (orientation: landscape) and (max-height: 400px) {
            .side-tile { width: 12px; height: 16px; }
        }

        /* ===== 竖屏：窄屏进一步压缩桌面、手牌用更小牌保证 14 张横排可见 ===== */
        @media (max-width: 480px) and (orientation: portrait) {
            .header { height: 34px; }
            .header-title { font-size: 12px; }
            .controls-group { gap: 4px; }
            select, button { font-size: 10px; padding: 2px 5px; }
            .mahjong-table {
                grid-template-rows: 66px minmax(0, 1fr) 112px;
                grid-template-columns: 38px minmax(0, 1fr) 38px;
                border-width: 5px;
            }
            .center-board { width: min(58vw, 200px); min-height: 78px; padding: 5px; }
            .turn-indicator { font-size: 11px; }
            /* 竖屏手牌：5.6vw≈21px(375屏)，14×21+间距≈328 < 375，能放下 */
            .area-south .hand-tiles .tile {
                width: clamp(20px, 5.6vw, 30px);
                height: clamp(30px, 8.4vw, 46px);
                border-bottom-width: 3px;
            }
            .area-south .hand-tiles .tile .tile-num { font-size: clamp(11px, 2.6vw, 16px); }
            .area-south .hand-tiles .tile .tile-char { font-size: clamp(7px, 1.4vw, 10px); }
            .area-south .hand-tiles .tile.selected { transform: translateY(-10px); }
            .drawn-tile-gap { margin-left: 8px !important; }
            .action-bar { bottom: 114px; right: 6px; gap: 6px; }
            .action-btn { width: 40px; height: 40px; font-size: 11px; }
            .action-btn.hu { font-size: 13px; }
            .discards-grid { max-width: 118px; }
            .side-tile { width: 12px; height: 18px; }
            .player-info { font-size: 9px; padding: 2px 5px; }
            /* 竖屏：东西两侧头像只留圆点，碰/杠牌缩小到列宽内 */
            .area-west .player-info, .area-east .player-info { padding: 2px; gap: 0; flex-direction: column; align-items: center; }
            .area-west .player-info > div:not(.avatar), .area-east .player-info > div:not(.avatar) { display: none; }
            .area-west .player-info .avatar, .area-east .player-info .avatar { width: 18px; height: 18px; font-size: 10px; }
            .area-west .melds-container, .area-east .melds-container { max-height: 56px; }

            .area-west .meld-group .tile.small .tile-num, .area-east .meld-group .tile.small .tile-num { font-size: 7px; }
            .area-west .meld-group .tile.small .tile-char, .area-east .meld-group .tile.small .tile-char { font-size: 5px; }
            .area-west .meld-group.gang, .area-east .meld-group.gang { flex-wrap: wrap; width: 19px; justify-content: center; }
        }
    .decision-table td,.decision-table th{vertical-align:top;}


        /* ===== 界面样式修正：仅解决东西碰/杠区裁剪，以及≤400px竖屏东西手牌少一张 ===== */
        /* 1) 东西家有四组碰/杠时，不再因为 max-height 把最后一组裁掉；保留原有换行布局。 */
        .area-west .melds-container,
        .area-east .melds-container {
            max-height: none;
            overflow: visible;
        }
        .area-west .side-melds,
        .area-east .side-melds {
            max-height: none;
            overflow: visible;
            align-content: flex-start;
        }

        /* 2) 宽度≤400px的竖屏：东西牌区从38px扩到52px，手牌改为横向换行，
              12px×18px的小牌每行可稳定容纳4张，13张牌变成4+4+4+1，全部可见。 */
        @media (max-width: 400px) and (orientation: portrait) {
            .mahjong-table {
                grid-template-columns: 52px minmax(0, 1fr) 52px;
            }

            .area-west .side-tile-wall,
            .area-east .side-tile-wall {
                flex: 0 0 auto;
                flex-direction: row !important;
                flex-wrap: wrap !important;
                width: 100%;
                height: auto;
                max-height: none;
                min-height: 0;
                align-content: flex-start;
                justify-content: center;
                gap: 1px !important;
                overflow: visible;
            }

            .area-west .melds-container,
            .area-east .melds-container {
                max-height: none;
                overflow: visible;
            }
        }
        /* ═══════ ★SVG牌面补丁（确认后原样搬进正式版）═══════
           只替换牌面图案，不动任何牌框尺寸/布局样式 */
        .tile.svg-face .tile-num, .tile.svg-face .tile-char { display: none; }
        .tile .tile-face {
            position: absolute;
            left: 6%; top: 4%;
            width: 88%; height: 92%;
            pointer-events: none;

        /* ===== 修正①：手机横屏下中央窗口压住南北弃牌 =====
           实测（844x390 / 667x375 / 568x320）中央区行高只有 159~174px，
           而中央窗口本体就占 135px，上下仅剩 ~19px 余量；
           南北弃牌带因 .discards-grid{max-width:min(40vmin,140px)} 只有 140px 宽，
           20 张牌被挤成 4 行、高 110px，加上 top:8px 直接压进窗口——
           从第 1 张弃牌（1 行 26px 高）起就已经被窗口盖住。
           中央区实在放不下「窗口 + 上下两条弃牌带」，所以让南北弃牌带跨出中央区，
           落到北家行/南家行本就空着的地方（北家行 66px 高只用了 29px，南家行同理）。
           纯 CSS，不动 DOM；桌面与竖屏不进入此媒体查询，完全不受影响。 */
        @media (orientation: landscape) and (max-height: 560px) {
            .area-center { overflow: visible; }

            /* 不再限宽（限宽是强制换行的元凶），改整列宽 + 强制单行：
               20 张 × (19+1)px = 400px，中央列最窄也有 416px，单行放得下 */
            .discards-north, .discards-south {
                max-width: none;
                width: 100%;
                flex-wrap: nowrap;
                gap: 1px;
            }
            /* 北弃牌带上浮到中央区上沿之外（落在北家行下部） */
            .discards-north { top: 0; transform: translate(-50%, -100%); }
            /* 南弃牌带下沉到中央区下沿之外（落在南家行上部） */
            .discards-south { bottom: 0; transform: translate(-50%, 100%); }

            /* 北家行内容改为顶对齐，给上浮的北弃牌带让出下方空间 */
            .area-north { align-items: flex-start; padding-top: 2px; }
            /* 南家行内容本就靠下对齐，顶部留白天然给南弃牌带 */
        }

        /* ===== 修正②：手机下东西两家的「庄」看不见了 =====
           原规则为了给东西家手牌墙腾纵向空间，把头像旁那一整块文字直接 display:none，
           而「庄」徽标 #dealer-tag-1 / #dealer-tag-3 正好嵌在被隐藏的块里，于是庄家标识一起消失。
           做法：不整块隐藏，改为把那一块收成 0 尺寸、只把「庄」徽标挂到头像右上角。
           徽标显隐本来就由 JS 控制（非庄时 display:none），所以不需要任何额外判断，
           也不占任何纵向/横向空间，东西家手牌墙的可用空间与改动前完全一致。 */
        @media ((orientation: landscape) and (max-height: 560px)), ((max-width: 480px) and (orientation: portrait)) {
            .area-west .player-info > div:not(.avatar),
            .area-east .player-info > div:not(.avatar) {
                display: block;                /* 覆盖原来的 display:none，但内容会被收成 0 */
                position: absolute;
                top: -4px; right: -6px;        /* 只让徽标露在头像右上角 */
                font-size: 0; line-height: 0;  /* 名字文字收成 0，不再占位 */
            }
            /* 积分行整行去掉（收成 0 也仍有分隔高度，直接不显示更干净） */
            .area-west .player-info > div:not(.avatar) .player-score,
            .area-east .player-info > div:not(.avatar) .player-score { display: none; }

            .area-west .player-info .dealer-badge,
            .area-east .player-info .dealer-badge {
                font-size: 9px; line-height: 1.15;
                padding: 1px 3px; margin: 0;
                border-radius: 3px;
            }
        }
        </style>

<script>
// ==========================================================================
// ★ 节奏参数（修正④）：全流程的"停留时间"都集中在这里，以后只改这一块就够了。
//    「深度思考中」这条提示的停留时长会自动跟随 timing.think，不用单独设置。
// ==========================================================================
const AI_TIMING = {
    think:        800,   // 机器人「深度思考」时长（中央"深度思考中"提示会自动跟随这个数）
    afterMeld:  1500,   // 机器人碰 / 杠之后停多久再开始下一手（也决定"碰/杠"提示实际可见多久）
    afterDiscard: 1000,  // 出牌之后多久才判定下一家（我与机器人共用）
    gangReveal:   800,   // 抢杠胡：亮杠之后多久才弹「抢杠胡」按钮 / 宣告
    gangSettle:   500,   // 抢杠胡：宣告之后多久结算
    tianHu:       800,   // 天胡宣告前的停顿
    dianPaoHu:    800,   // 点炮胡公告后到结算的停顿
    settleModal: 1200,   // 胡牌结算弹窗延迟
    announceHold: 5000,  // 公告兜底停留（没有任何后续公告覆盖它时，例如"我 碰"）
};

const SUITS = { WAN: 'wan', TONG: 'tong', TIAO: 'tiao', ZHONG: 'zhong' };

function parseTile(tileStr) {
    if (!tileStr) return { suit: '', num: '', char: '' };
    if (tileStr === 'zhong') return { suit: SUITS.ZHONG, num: '中', char: '' };
    const num = parseInt(tileStr[0], 10);
    const suit = tileStr.slice(1);
    const charMap = { 'wan': '万', 'tong': '筒', 'tiao': '条' };
    return { suit, num, char: charMap[suit] || '' };
}

function createDeck() {
    const deck = [];
    ['wan', 'tong', 'tiao'].forEach(s => {
        for (let i = 1; i <= 9; i++) {
            for (let k = 0; k < 4; k++) deck.push(`${i}${s}`);
        }
    });
    for (let k = 0; k < 4; k++) deck.push('zhong');
    for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
}

function sortTiles(tiles) {
    const suitOrder = { 'wan': 1, 'tong': 2, 'tiao': 3, 'zhong': 4 };
    return [...tiles].sort((a, b) => {
        const ta = parseTile(a), tb = parseTile(b);
        if (suitOrder[ta.suit] !== suitOrder[tb.suit]) return suitOrder[ta.suit] - suitOrder[tb.suit];
        return (typeof ta.num === 'number' ? ta.num : 0) - (typeof tb.num === 'number' ? tb.num : 0);
    });
}

class MahjongEvaluator {
    static getCounts(tiles) {
        const counts = {};
        tiles.forEach(t => counts[t] = (counts[t] || 0) + 1);
        return counts;
    }

    static canFormMelds(counts) {
        // 关键修复：按花色+数值排序选“数值最小的未处理牌”，
        // 保证它必然是某面子的起点（顺子起点或刻子）。
        // 不能用 Object.keys 的插入顺序——checkStandardHuWithMelds 会把补杠牌
        // append 到末尾破坏顺序，导致顺子中间牌被先处理而漏判（抢杠胡不触发的根因）。
        const suitOrder = { 'wan': 1, 'tong': 2, 'tiao': 3, 'zhong': 4 };
        const keys = Object.keys(counts).filter(t => counts[t] > 0)
            .sort((a, b) => {
                const ta = parseTile(a), tb = parseTile(b);
                if (suitOrder[ta.suit] !== suitOrder[tb.suit]) return suitOrder[ta.suit] - suitOrder[tb.suit];
                return (typeof ta.num === 'number' ? ta.num : 0) - (typeof tb.num === 'number' ? tb.num : 0);
            });
        const tile = keys[0];
        if (!tile) return true;

        if (counts[tile] >= 3) {
            counts[tile] -= 3;
            if (this.canFormMelds(counts)) {
                counts[tile] += 3;
                return true;
            }
            counts[tile] += 3;
        }

        const parsed = parseTile(tile);
        if (parsed.suit !== SUITS.ZHONG && typeof parsed.num === 'number' && parsed.num <= 7) {
            const tile2 = `${parsed.num + 1}${parsed.suit}`;
            const tile3 = `${parsed.num + 2}${parsed.suit}`;

            if ((counts[tile2] || 0) > 0 && (counts[tile3] || 0) > 0) {
                counts[tile]--;
                counts[tile2]--;
                counts[tile3]--;

                if (this.canFormMelds(counts)) {
                    counts[tile]++;
                    counts[tile2]++;
                    counts[tile3]++;
                    return true;
                }

                counts[tile]++;
                counts[tile2]++;
                counts[tile3]++;
            }
        }

        return false;
    }

    static checkSevenPairs(hand) {
        if (hand.length !== 14) return null;
        const counts = this.getCounts(hand);
        let pairs = 0, quads = 0;
        for (const t in counts) {
            if (counts[t] === 2) pairs++;
            else if (counts[t] === 4) quads++;
            else return null;
        }
        if (pairs + quads * 2 === 7) return { deluxe: quads };
        return null;
    }

    static checkBigPairs(hand, melds) {
        // 规则（2026-09-04 调整）：大对子(碰碰胡)允许含杠——补杠/暗杠/直接开杠均可，杠按一组刻子计。
        // 杠后摸过补牌，暗手牌数 = 14 - 刻子数*3 依然成立（杠的第4张在 meld 里）。
        if ((hand.length + melds.length * 3) !== 14) return false;
        const counts = this.getCounts(hand);
        let pairCount = 0;
        for (const t in counts) {
            if (counts[t] === 2) pairCount++;
            else if (counts[t] !== 3) return false;
        }
        return pairCount === 1;
    }

    static isFlush(hand, melds) {
        const allTiles = [...hand];
        melds.forEach(m => allTiles.push(...m.tiles));
        if (allTiles.length === 0) return false;
        const firstSuit = parseTile(allTiles[0]).suit;
        if (firstSuit === SUITS.ZHONG) return false;
        return allTiles.every(t => parseTile(t).suit === firstSuit);
    }

    static checkStandardHu(hand) {
        if (hand.length % 3 !== 2) return false;
        const counts = this.getCounts(hand);
        const uniqueTiles = Object.keys(counts);

        for (const pairTile of uniqueTiles) {
            if (counts[pairTile] >= 2) {
                const tempCounts = { ...counts };
                tempCounts[pairTile] -= 2;
                if (this.canFormMelds(tempCounts)) return true;
            }
        }
        return false;
    }

    // 判断“带已有碰/杠”的标准胡。hand 只保存暗手牌；已有每组碰/杠按3张面子计入14张结构。
    static checkStandardHuWithMelds(hand, melds = [], extraTile = null) {
        const safeHand = Array.isArray(hand) ? hand : [];
        const safeMelds = Array.isArray(melds) ? melds : [];
        const fullHand = extraTile === null ? [...safeHand] : [...safeHand, extraTile];
        const expectedConcealedCount = 14 - safeMelds.length * 3;
        if (expectedConcealedCount < 2 || fullHand.length !== expectedConcealedCount) return false;
        return this.checkStandardHu(fullHand);
    }

    // 统一判断某张牌加入后是否成立。
    static canWinWithTile(hand, melds = [], tile, options = {}) {
        const { isDealerFirstDiscard = false, isQiangGang = false } = options;
        const safeHand = Array.isArray(hand) ? hand : [];
        const safeMelds = Array.isArray(melds) ? melds : [];
        const fullHand = [...safeHand, tile];

        // 抢杠胡：只允许普通结构（清一色只是普通结构的额外计分），不能抢成七小对/大对子。
        if (isQiangGang) {
            return this.checkStandardHuWithMelds(safeHand, safeMelds, tile);
        }

        const isStd = this.checkStandardHuWithMelds(safeHand, safeMelds, tile);
        const is7P = safeMelds.length === 0 && this.checkSevenPairs(fullHand);
        const isBigP = this.checkBigPairs(fullHand, safeMelds);
        const isFl = this.isFlush(fullHand, safeMelds);

        if (isDealerFirstDiscard) {
            return !!(isStd || is7P || isBigP || (isFl && (isStd || is7P || isBigP)));
        }

        return !!(is7P || isBigP || (isFl && (isStd || is7P || isBigP)));
    }

    static canSelfDrawHu(hand, melds = []) {
        // 自摸时，当前手牌本身就是完整胡牌结构。
        const isStd = this.checkStandardHuWithMelds(hand, melds);
        const is7P = melds.length === 0 && this.checkSevenPairs(hand);
        const isBigP = this.checkBigPairs(hand, melds);
        return !!(isStd || is7P || isBigP);
    }

    static canDiscardHu(hand, melds, tile, isDealerFirstDiscard = false, isQiangGang = false) {
        return this.canWinWithTile(hand, melds, tile, { isDealerFirstDiscard, isQiangGang });
    }

    static getTingInfo(hand, melds) {
        const tingTiles = [];
        const allPossible = [];
        ['wan', 'tong', 'tiao'].forEach(s => {
            for (let i = 1; i <= 9; i++) allPossible.push(`${i}${s}`);
        });
        allPossible.push('zhong');

        for (const t of allPossible) {
            // 听牌信息描述的是“摸到后能否自摸胡”，不受点炮/抢杠胡限制。
            if (this.canSelfDrawHu([...hand, t], melds)) {
                tingTiles.push(t);
            }
        }

        return {
            isTing: tingTiles.length > 0,
            tingTiles
        };
    }
}

// ★碰牌路线改造：牌墙剩余张数 ≤ 此值视为残局（满墙 60 张的 1/3，可调）
const PENG_LATE_GAME_WALL = 20;

class RobotAI {
    // 修正策略定位逻辑：结合刻子数与对子数，准确区别【大对子】与【七小对】
    static analyzeHandDirection(hand, melds) {
        const allTiles = [...hand];
        melds.forEach(m => allTiles.push(...m.tiles));
        
        const suitCounts = { 'wan': 0, 'tong': 0, 'tiao': 0, 'zhong': 0 };
        allTiles.forEach(t => suitCounts[parseTile(t).suit]++);

        const maxSuit = Object.keys(suitCounts).reduce((a, b) => suitCounts[a] > suitCounts[b] ? a : b);
        const maxSuitCount = suitCounts[maxSuit];
        const flushRatio = maxSuitCount / allTiles.length;

        const counts = MahjongEvaluator.getCounts(hand);
        let pairCount = 0;
        let tripletCount = 0;
        for (const t in counts) {
            if (counts[t] === 2) pairCount++;
            if (counts[t] >= 3) tripletCount++;
        }

        // 刻子数加上碰掉的牌组
        const totalTriplets = tripletCount + melds.length;

        if (flushRatio >= 0.75 && maxSuit !== 'zhong') {
            const suitName = { 'wan': '万字', 'tong': '筒字', 'tiao': '条字' }[maxSuit];
            return {
                type: 'FLUSH',
                name: `清一色 (${suitName})`,
                reason: `手牌中 ${suitName} 占了 ${Math.round(flushRatio * 100)}%，专注做清一色大牌！`
            };
        } 
        // 优先判断大对子：拥有3组及以上刻子/碰牌，或者刻子+对子且已有碰牌
        else if (totalTriplets >= 3 || (totalTriplets >= 2 && pairCount >= 1 && melds.length > 0)) {
            return {
                type: 'ALL_TRIPLETS',
                name: '大对子 (碰碰胡)',
                reason: `手牌已有 ${totalTriplets} 组刻子/碰牌，目标做大对子(碰碰胡)！`
            };
        } 
        // 只有在门清（未碰杠）且对子数多（>=4对）时才判定为七小对
        else if (pairCount >= 4 && melds.length === 0 && tripletCount === 0) {
            return {
                type: 'SEVEN_PAIRS',
                name: '七小对',
                reason: `门清手牌已有 ${pairCount} 个对子，且未碰/杠牌，全力冲刺七小对！`
            };
        } else {
            return {
                type: 'STANDARD',
                name: '快速平胡听牌',
                reason: `追求最快听牌和成牌效率，优先保留多面搭子与中张牌。`
            };
        }
    }

    // tiles：当前手牌（不含已碰/杠出去的组）；melds：已亮明的组（碰/杠）
    // 已碰/杠的每一组按"一组面子 = 100 分"计结构分，
    // 这样：碰过1组的人手牌10张+碰1组 = handScore(10) + 100，
    // 与未碰者的13张手牌（结构分handScore(13)）就有了可比性。
    static evaluateHandValue(tiles, melds = []) {
        const sorted = sortTiles(tiles);
        const handScore = RobotAI.findMaxMeldScore(sorted, {});
        const meldScore = (melds || []).length * 100;
        return handScore + meldScore;
    }

    static findMaxMeldScore(tiles, memo = {}) {
        if (tiles.length === 0) return 0;
        const key = tiles.join(',');
        if (memo[key] !== undefined) return memo[key];

        let maxScore = 0;
        const first = tiles[0];
        const countFirst = tiles.filter(t => t === first).length;

        if (countFirst >= 3) {
            const remaining = [...tiles];
            remaining.splice(remaining.indexOf(first), 1);
            remaining.splice(remaining.indexOf(first), 1);
            remaining.splice(remaining.indexOf(first), 1);
            maxScore = Math.max(maxScore, 100 + RobotAI.findMaxMeldScore(remaining, memo));
        }

        const p = parseTile(first);
        if (p.suit !== SUITS.ZHONG && typeof p.num === 'number' && p.num <= 7) {
            const n2 = `${p.num + 1}${p.suit}`;
            const n3 = `${p.num + 2}${p.suit}`;
            if (tiles.includes(n2) && tiles.includes(n3)) {
                const remaining = [...tiles];
                remaining.splice(remaining.indexOf(first), 1);
                remaining.splice(remaining.indexOf(n2), 1);
                remaining.splice(remaining.indexOf(n3), 1);
                maxScore = Math.max(maxScore, 100 + RobotAI.findMaxMeldScore(remaining, memo));
            }
        }

        if (countFirst >= 2) {
            const remaining = [...tiles];
            remaining.splice(remaining.indexOf(first), 1);
            remaining.splice(remaining.indexOf(first), 1);
            maxScore = Math.max(maxScore, 35 + RobotAI.findMaxMeldScore(remaining, memo));
        }

        if (p.suit !== SUITS.ZHONG && typeof p.num === 'number') {
            if (p.num <= 8) {
                const n2 = `${p.num + 1}${p.suit}`;
                if (tiles.includes(n2)) {
                    const remaining = [...tiles];
                    remaining.splice(remaining.indexOf(first), 1);
                    remaining.splice(remaining.indexOf(n2), 1);
                    const tatsuVal = (p.num >= 2 && p.num <= 7) ? 18 : 12;
                    maxScore = Math.max(maxScore, tatsuVal + RobotAI.findMaxMeldScore(remaining, memo));
                }
            }
            if (p.num <= 7) {
                const n3 = `${p.num + 2}${p.suit}`;
                if (tiles.includes(n3)) {
                    const remaining = [...tiles];
                    remaining.splice(remaining.indexOf(first), 1);
                    remaining.splice(remaining.indexOf(n3), 1);
                    maxScore = Math.max(maxScore, 10 + RobotAI.findMaxMeldScore(remaining, memo));
                }
            }
        }

        const remaining = [...tiles];
        remaining.shift();
        let isoVal = 0;
        if (p.suit === SUITS.ZHONG) {
            isoVal = 0;
        } else {
            isoVal = (p.num >= 3 && p.num <= 7) ? 4 : 2;
        }
        maxScore = Math.max(maxScore, isoVal + RobotAI.findMaxMeldScore(remaining, memo));

        memo[key] = maxScore;
        return maxScore;
    }

    // ★碰牌路线改造：统计一张牌在全场明牌（所有人弃牌+碰杠）中已可见张数。
    // 对子死活判定用：第3张剩余 = 4 - 手里2张 - 可见张数；剩余0 = 死对（永远凑不成刻子）。
    static countTileVisible(game, tile) {
        let visible = 0;
        (game.players || []).forEach(p => {
            (p.discards || []).forEach(t => { if (t === tile) visible++; });
            (p.melds || []).forEach(m => (m.tiles || []).forEach(t => { if (t === tile) visible++; }));
        });
        return visible;
    }

    // ★碰牌路线改造：门清手牌的"七小对 vs 大对"路线统计。
    // pairs/triplets/quads = 手里对子/刻子/四张数；livePairs/deadPairs = 活对/死对数；
    // liveSingles = 活单张数（★碰牌路线v6：这种牌还剩≥1张没露面，将来还能摸成对；
    //                枯单张=3张全在明牌，永远配不成对，不算供给）；
    // blocks = 组数（对+刻+四张）；blanks = 坯子（刻子+四张+活对，能最终变成刻子的原料）；
    // spProgress = 七小对进度（对子 + 2×四张，满分 7）。
    static analyzePairRoutes(game, hand) {
        const counts = MahjongEvaluator.getCounts(hand);
        let pairs = 0, triplets = 0, quads = 0, livePairs = 0, deadPairs = 0, liveSingles = 0;
        for (const t in counts) {
            if (counts[t] === 2) {
                pairs++;
                if (4 - 2 - RobotAI.countTileVisible(game, t) > 0) livePairs++; else deadPairs++;
            } else if (counts[t] === 3) triplets++;
            else if (counts[t] === 4) quads++;
            else if (counts[t] === 1) {
                if (4 - 1 - RobotAI.countTileVisible(game, t) > 0) liveSingles++;
            }
        }
        return {
            pairs, triplets, quads, livePairs, deadPairs, liveSingles,
            blocks: pairs + triplets + quads,
            blanks: triplets + quads + livePairs,
            spProgress: pairs + quads * 2
        };
    }

    // 碰牌决策。★碰牌路线v6：新增第三参 game（统计全场明牌与牌墙进度）。
    // 门清且对子+刻子+四张 ≥4 时按"七小对 vs 大对"路线判定表决策（命中即停）。
    // 原理：两路同分，谁近走谁；步数打平时碰胜（碰=确定收入+平胡兜底+杠上限，七小对零兜底）。
    // 步数：七小对差 N 对 = 还要 N 次"摸成对"事件；大对碰完还差 3 刻 = 3 次"成刻"事件。
    //   行1 差1对(进度≥6) → 拒守（1步 vs 3步）；
    //   行2 差2对(进度5) → 拒守（2步 vs 3步；5全活对也守，死对不妨碍七小对，供给靠摸牌流）；
    //   行3 差3对(进度4) → 早局且大对可成(刻+四+活对+活单≥4)碰 / 残局或凑不齐拒（3=3打平，碰的确定性胜）；
    //   行4 差≥4对(进度≤3)或刻+四≥2 → 七小对无望：大对可成碰（残局也碰）/ 否则落回通用结构分逻辑。
    // 不传 game（旧脚本兼容）或清一色定性手牌 → 走原有通用逻辑，行为不变。
    static evaluatePengDecision(aiPlayer, tile, game) {
        const hand = aiPlayer.hand;
        const targetStrategy = RobotAI.analyzeHandDirection(hand, aiPlayer.melds);
        const parsed = parseTile(tile);
        const tileName = parsed.suit === SUITS.ZHONG ? '红中' : `${parsed.num}${parsed.char}`;

        // ★碰牌路线改造：兼容旧两参调用——保留原"七小对定性拒碰"行为
        if (!game && targetStrategy.type === 'SEVEN_PAIRS') {
            return {
                shouldPeng: false,
                reason: `放弃碰 [${tileName}]：当前策略为【七小对】，碰牌会破坏门清！`,
                detailHtml: `<div class="log-item">
                               <p style="color:#f39c12; font-weight:bold;">⚡ 碰牌响应评估：过碰 [${tileName}]</p>
                               <p>手牌定性为【七小对】，碰牌倒牌后将彻底无法达成七小对，故坚决放弃碰牌。</p>
                             </div>`
            };
        }

        // ★碰牌路线v6：路线判定表（穷举七小对进度 0~6 全部取值，命中即停）
        if (game && aiPlayer.melds.length === 0 && targetStrategy.type !== 'FLUSH') {
            const info = RobotAI.analyzePairRoutes(game, hand);
            if (info.blocks >= 4) {
                const prog = `七小对进度 ${info.spProgress}/7`;
                const early = game.deck.length > PENG_LATE_GAME_WALL;
                // 大对可成：碰完还差 3 刻，来源 = 刻子/四张 + 剩余活对 + 活单张，合计 ≥4 才凑得齐
                const tripletSources = info.triplets + info.quads + info.livePairs + info.liveSingles;
                const canBig = tripletSources >= 4;
                const mk = (shouldPeng, title, color, reason, detail) => ({
                    shouldPeng,
                    reason,
                    detailHtml: `<div class="log-item">
                               <p style="color:${color}; font-weight:bold;">⚡ 碰牌响应评估：${title} [${tileName}]</p>
                               <p>${detail}</p>
                             </div>`
                });
                // 行1：差 1 对（进度≥6）→ 拒守
                if (info.spProgress >= 6) {
                    return mk(false, '过碰', '#f39c12',
                        `放弃碰 [${tileName}]：${prog}只差 1 对，锁死保七小对（最后一张可点炮胡）。`,
                        `七小对还差 1 次摸成对，比碰后还差 3 组刻子更近；碰牌毁门清且手形回不了头。`);
                }
                // 行2：差 2 对（进度=5）→ 拒守
                if (info.spProgress === 5) {
                    return mk(false, '过碰', '#f39c12',
                        `放弃碰 [${tileName}]：${prog}差 2 对，守七小对（最后一张可点炮胡）。`,
                        `七小对还差 2 次摸成对，比碰后还差 3 组刻子更近；死对不妨碍七小对进度，枯单张打掉后摸上来的新牌就是新供给。`);
                }
                // 行3：差 3 对（进度=4）→ 步数打平（3 vs 3），碰的确定性胜，但需早局+原料够
                if (info.spProgress === 4) {
                    if (!canBig) {
                        return mk(false, '过碰', '#f39c12',
                            `放弃碰 [${tileName}]：${prog}差 3 对，碰后成刻来源仅 ${tripletSources} 个凑不齐 4 组刻子，保七小对。`,
                            `大对路线已封顶（刻子/四张 ${info.triplets + info.quads} + 活对 ${info.livePairs} + 活单张 ${info.liveSingles}），碰了也凑不齐，守门清等摸牌补供给。`);
                    }
                    if (!early) {
                        return mk(false, '过碰', '#bdc3c7',
                            `放弃碰 [${tileName}]：差 3 对均势区但已到残局（牌墙仅余 ${game.deck.length} 张），滚不动大对雪球，保七小对双路线。`,
                            `残局时间预算不足，碰完后续刻子接不上，守七小对每摸一对都是实进度。`);
                    }
                    return mk(true, '决定碰', '#2ecc71',
                        `碰 [${tileName}]：差 3 对均势区，早局（牌墙余 ${game.deck.length} 张）且成刻来源 ${tripletSources} 个，先碰先赢转大对。`,
                        `碰=到手 1 刻+补摸 1 张，对平胡也是面子；剩余活对 ${info.livePairs - 1} 个继续接力，唯一代价是放弃七小对。`);
                }
                // 行4：差≥4对（进度≤3）或 刻子+四张≥2 → 七小对已无望
                if (info.spProgress <= 3 || info.triplets + info.quads >= 2) {
                    if (canBig) {
                        return mk(true, '决定碰', '#2ecc71',
                            `碰 [${tileName}]：${prog}${info.triplets + info.quads >= 2 ? `、已有 ${info.triplets + info.quads} 组刻杠` : ''}，七小对已无望，碰锁定刻子服务大对/平胡。`,
                            `成刻来源 ${tripletSources} 个（刻子/四张 ${info.triplets + info.quads} + 活对 ${info.livePairs} + 活单张 ${info.liveSingles}）足够 4 组刻子，碰对平胡也是面子。`);
                    }
                    // 凑不齐 → 落回下方通用结构分逻辑
                }
            }
        }

        let pCount = 0;
        const tempHand = hand.filter(t => {
            if (t === tile && pCount < 2) { pCount++; return false; }
            return true;
        });

        // 碰前：手牌+现有melds；碰后：手牌少2张，melds多1组peng。
        const valBefore = RobotAI.evaluateHandValue(hand, aiPlayer.melds);
        const valAfter = RobotAI.evaluateHandValue(tempHand, [...aiPlayer.melds, { type: 'peng', tiles: [tile, tile, tile] }]);
        const netGain = (valAfter + 100) - valBefore;

        if (netGain >= 20 || targetStrategy.type === 'ALL_TRIPLETS') {
            return {
                shouldPeng: true,
                reason: `碰 [${tileName}]：碰牌后形成刻子，大幅提升进张速度！`,
                detailHtml: `<div class="log-item">
                               <p style="color:#2ecc71; font-weight:bold;">⚡ 碰牌响应评估：决定碰 [${tileName}]</p>
                               <p>手牌已有一对 [${tileName}]，碰牌可锁定刻子，加速成型。</p>
                             </div>`
            };
        } else {
            return {
                shouldPeng: false,
                reason: `放弃碰 [${tileName}]：碰牌后手牌搭子断层，故放弃。`,
                detailHtml: `<div class="log-item">
                               <p style="color:#bdc3c7; font-weight:bold;">⚡ 碰牌响应评估：过碰 [${tileName}]</p>
                               <p>评估发现碰出 [${tileName}] 会导致手牌搭子断层，故选择保留对子自己摸牌。</p>
                             </div>`
            };
        }
    }

    static tileName(tile) {
        const p = parseTile(tile);
        return p.suit === SUITS.ZHONG ? '红中' : `${p.num}${p.char}`;
    }

    // 杠之前的评估。
    //   - 暗杠不会被抢：只要结构损失不严重（>= -50）就杠；多成型1组面子通常都划算。
    //   - 补杠可能被抢：按补杠牌位置分级评估被抢风险（中张 3-7 风险最高），
    //     若自己未听牌 + 中张补杠，直接放弃（被抢 = 别人胡，自己少1张摸牌机会）。
    static evaluateGangDecision(game, aiIdx, gangTile, gangType) {
        const aiPlayer = game.players[aiIdx];
        const hand = aiPlayer.hand;
        const melds = aiPlayer.melds;
        const parsed = parseTile(gangTile);
        const tileName = RobotAI.tileName(gangTile);

        const valBefore = RobotAI.evaluateHandValue(hand, melds);

        // 七小对保护（仅暗杠+门清）：七小对进度=对子数+2×四张数（满分7）。
        // 进度>=6 即最多差1对成七小对：胡牌期望(12~24×stake 总分)远超暗杠(6×stake)，且暗杠后非门清七小对永久不可胡，不可逆 → 放弃暗杠。
        // 进度<=5 差2对以上，七小对期望低，按正常结构评估；补杠已有碰牌、七小对已不可能，无需保护。
        if (gangType === 'angang' && melds.length === 0) {
            const cnt = MahjongEvaluator.getCounts(hand);
            let spProgress = 0;
            for (const t in cnt) {
                if (cnt[t] === 2) spProgress++;
                else if (cnt[t] === 4) spProgress += 2;
            }
            if (spProgress >= 6) {
                const reason = `放弃暗杠 [${tileName}]：门清七小对进度 ${spProgress}/7（最多差1对成七小对），七小对收益远高于暗杠，保七小对。`;
                const detailHtml = `<div class="log-item">
                    <p style="color:#bdc3c7; font-weight:bold;">🛡️ 杠评估：⛔ 放弃暗杠 [${tileName}]（七小对保护）</p>
                    <p style="font-size:12px; color:#bbb; margin:4px 0;">${reason}</p>
                </div>`;
                return { shouldGang: false, structDelta: 0, robRisk: 0, totalScore: 0, reason, detailHtml };
            }
        }

        let handAfter, meldsAfter;
        if (gangType === 'angang') {
            handAfter = hand.filter(t => t !== gangTile);
            meldsAfter = [...melds, { type: 'angang', tiles: [gangTile, gangTile, gangTile, gangTile] }];
        } else {
            const idx = hand.indexOf(gangTile);
            handAfter = [...hand];
            handAfter.splice(idx, 1);
            meldsAfter = melds.map(m =>
                (m.type === 'peng' && m.tiles[0] === gangTile)
                    ? { type: 'gang', tiles: [...m.tiles, gangTile] }
                    : m
            );
        }
        const valAfter = RobotAI.evaluateHandValue(handAfter, meldsAfter);
        const structDelta = valAfter - valBefore;   // 已含“杠=1组面子=100分”的结构收益

        let robRisk = 0;
        let riskNote = '暗杠不可被抢';
        if (gangType === 'bugang') {
            // 抢杠胡：补杠牌只能作顺子一端（听牌家手牌不含补杠牌）
            if (parsed.suit === SUITS.ZHONG) {
                robRisk = 3;
                riskNote = '红中不能作顺子，被抢概率极低';
            } else if (parsed.num === 1 || parsed.num === 9) {
                robRisk = 8;
                riskNote = '1/9 边张只能作边张顺子一端，被抢概率较低';
            } else if (parsed.num === 2 || parsed.num === 8) {
                robRisk = 18;
                riskNote = '2/8 可作两面顺子，被抢概率中等';
            } else {
                robRisk = 40;
                riskNote = '3-7 中张可作多种顺子（两面/嵌张/边张），被抢概率较高';
            }
        }

        // 杠后多摸1张新牌的期望价值（约等于一张能形成面子/对子的概率收益）
        const drawValue = (gangType === 'bugang') ? 30 : 30;
        const totalScore = structDelta + drawValue - robRisk;

        const isMidTileRisk = (gangType === 'bugang'
            && parsed.suit !== SUITS.ZHONG
            && parsed.num >= 3 && parsed.num <= 7);

        let shouldGang;
        if (gangType === 'angang') {
            shouldGang = structDelta >= -50;
        } else {
            // 补杠：综合分 > 0 才杠；中张补杠结构损失时更严格（structDelta < -50 直接放弃）
            shouldGang = totalScore > 0 && !(isMidTileRisk && structDelta < -50);
        }

        const actionLabel = shouldGang
            ? (gangType === 'angang' ? '✅ 执行暗杠' : '✅ 执行补杠')
            : (gangType === 'angang' ? '⛔ 放弃暗杠' : '⛔ 放弃补杠');

        const reason = shouldGang
            ? (gangType === 'angang'
                ? `暗杠 [${tileName}]：结构净变化${structDelta >= 0 ? '+' : ''}${structDelta}，暗杠不可被抢，收益明显。`
                : `补杠 [${tileName}]：结构净变化${structDelta >= 0 ? '+' : ''}${structDelta}，被抢风险${robRisk}（${riskNote}），综合评分${totalScore}。`)
            : (gangType === 'angang'
                ? `放弃暗杠 [${tileName}]：结构损失${structDelta}过大，杠掉反而损害手牌结构。`
                : `放弃补杠 [${tileName}]：被抢风险${robRisk}过高（${riskNote}），综合评分${totalScore}。`);

        const detailHtml = `<div class="log-item">
            <p style="color:${shouldGang ? '#2ecc71' : '#bdc3c7'}; font-weight:bold;">💥 杠评估：${actionLabel} [${tileName}]</p>
            <p style="font-size:12px; color:#bbb; margin:4px 0;">${reason}</p>
            <p style="font-size:11px; color:#888; margin:2px 0;">
                杠前结构分：${valBefore}　杠后结构分：${valAfter}（净${structDelta >= 0 ? '+' : ''}${structDelta}）
                ${gangType === 'bugang' ? `　被抢风险：${robRisk}` : ''}
            </p>
            ${gangType === 'bugang' ? `<p style="font-size:11px; color:#888;">风险分析：${riskNote}</p>` : ''}
        </div>`;

        return { shouldGang, structDelta, robRisk, totalScore, reason, detailHtml };
    }


    // 找出一张牌在当前手牌里实际依附的对子/搭子/刻子。
    // 这部分只用于“解释”，不参与AI最终评分，避免把内部评分伪装成牌理。
    static getTileConnections(hand, tile) {
        const p = parseTile(tile);
        const counts = MahjongEvaluator.getCounts(hand);
        const result = [];
        const seen = new Set();
        const add = (text) => { if (text && !seen.has(text)) { seen.add(text); result.push(text); } };

        if ((counts[tile] || 0) >= 2) {
            add(`有${counts[tile] === 2 ? '一对' : '同牌组合'}${this.tileName(tile)}`);
        }
        if ((counts[tile] || 0) >= 3) add(`已经形成${this.tileName(tile)}刻子`);

        if (p.suit !== SUITS.ZHONG && typeof p.num === 'number') {
            const s = p.suit;
            const n = p.num;
            const exists = (x) => x >= 1 && x <= 9 && (counts[`${x}${s}`] || 0) > 0;
            if (exists(n - 1)) add(`参与${n - 1}${p.char}${n}${p.char}搭子`);
            if (exists(n + 1)) add(`参与${n}${p.char}${n + 1}${p.char}搭子`);
            if (exists(n - 2)) add(`参与${n - 2}${p.char}${n}${p.char}嵌张搭子`);
            if (exists(n + 2)) add(`参与${n}${p.char}${n + 2}${p.char}嵌张搭子`);
        }
        return result;
    }

    // 一张牌被打掉以后，下一次摸到哪些牌会直接形成新的对子/搭子/面子。
    // 这里统计“牌种类”而不是剩余张数，正对应用户想看的“未来摸牌路数”。
    static getUsefulDraws(hand, melds = [], game = null, precomputedWinning = null) {
        const allPossible = [];
        ['wan', 'tong', 'tiao'].forEach(s => {
            for (let i = 1; i <= 9; i++) allPossible.push(`${i}${s}`);
        });
        allPossible.push('zhong');

        const counts = MahjongEvaluator.getCounts(hand);
        const useful = [];
        // winning：若调用方已算好（getTingInfo 的 tingTiles），直接复用，
        // 避免 28 次重复 canSelfDrawHu 调用（性能优化关键点）
        const winning = precomputedWinning ? [...precomputedWinning] : [];
        const winningSet = new Set(winning);
        const meld = [];
        const tatsu = [];
        const pair = [];

        const hasSequence = (tiles) => {
            const c = new Set(tiles);
            for (const t of c) {
                const p = parseTile(t);
                if (p.suit !== SUITS.ZHONG && typeof p.num === 'number' && c.has(`${p.num + 1}${p.suit}`) && c.has(`${p.num + 2}${p.suit}`)) return true;
            }
            return false;
        };

        for (const t of allPossible) {
            const beforeCounts = MahjongEvaluator.getCounts(hand);
            const after = [...hand, t];
            const afterCounts = MahjongEvaluator.getCounts(after);
            const gainedPair = (afterCounts[t] >= 2) && (beforeCounts[t] < 2);
            const gainedTriplet = (afterCounts[t] >= 3) && (beforeCounts[t] < 3);

            const p = parseTile(t);
            let gainedSequence = false;
            let gainedTatsu = false;
            if (p.suit !== SUITS.ZHONG && typeof p.num === 'number') {
                const s = p.suit, n = p.num;
                const exists = (x) => x >= 1 && x <= 9 && (beforeCounts[`${x}${s}`] || 0) > 0;
                // 这张新摸到的牌必须亲自参与形成顺子，否则不能把别处已有的顺子算到它头上。
                gainedSequence = (exists(n - 1) && exists(n - 2)) || (exists(n - 1) && exists(n + 1)) || (exists(n + 1) && exists(n + 2));
                // 两张搭子：12/23这类相邻搭子，或13这类嵌张搭子。
                gainedTatsu = exists(n - 1) || exists(n + 1) || exists(n - 2) || exists(n + 2);
            }

            // 仅当没有预计算 winning 时才调用昂贵的 canSelfDrawHu（28 次/调用是性能大头）
            if (!precomputedWinning) {
                if (MahjongEvaluator.canSelfDrawHu(after, melds)) winning.push(t);
            }
            if (gainedTriplet || (gainedSequence && after.length <= 14)) meld.push(t);
            else if (gainedTatsu) tatsu.push(t);
            else if (gainedPair) pair.push(t);

            if (gainedTriplet || gainedSequence || gainedTatsu || gainedPair || winningSet.has(t)) useful.push(t);
        }

        // 算期望张数：看牌局剩余可摸张数，过滤已打光的牌
        // useful 数组只保留"剩余可摸>0"的牌；usefulWeighted 是所有有用牌的剩余张数总和
        // 文案和评分都用这俩字段，保证一致
        let usefulWeighted = 0;
        const filteredUseful = [];
        const filteredWinning = [];
        for (const t of useful) {
            const remaining = game ? RobotAI.countRemaining(game, hand, melds, t) : 4;
            if (remaining > 0) {
                filteredUseful.push(t);
                usefulWeighted += remaining;
            }
        }
        for (const t of winning) {
            const remaining = game ? RobotAI.countRemaining(game, hand, melds, t) : 4;
            if (remaining > 0) filteredWinning.push(t);
        }

        return { useful: filteredUseful, usefulWeighted, winning: filteredWinning, meld, tatsu, pair };
    }

    // ★进张活性改造：判断摸进 d 后新形成的搭子是否全是"只等一头"的边张搭子（1-2/1-3/7-9/8-9）
    // 摸进后成对子/刻子的不算搭子（不打折）；能两面以上组合的好形也不打折
    static isEdgeTatsuDraw(hand, d) {
        const p = parseTile(d);
        if (p.suit === SUITS.ZHONG || typeof p.num !== 'number') return false;
        const counts = MahjongEvaluator.getCounts(hand);
        if ((counts[d] || 0) >= 1) return false; // 手里已有同牌，摸进成对子/刻子，非搭子
        const n = p.num, s = p.suit;
        const has = (x) => x >= 1 && x <= 9 && (counts[`${x}${s}`] || 0) > 0;
        const shapes = [];
        if (has(n - 1)) shapes.push([n - 1, n]);
        if (has(n + 1)) shapes.push([n, n + 1]);
        if (has(n - 2)) shapes.push([n - 2, n]);
        if (has(n + 2)) shapes.push([n, n + 2]);
        if (!shapes.length) return false;
        const isEdge = ([a, b]) => (a === 1 && b <= 3) || (a >= 7 && b === 9);
        return shapes.every(isEdge);
    }

    // 统计某张牌在全场已见张数（自己手牌+自己melds+全场弃牌+全场melds）
    // 剩余可摸 = 4 - 已见（万筒条1-9各4张，红中4张）
    // 别家手牌看不到，不算（未知）
    static countRemaining(game, hand, melds, tile) {
        let seen = 0;
        seen += hand.filter(t => t === tile).length;
        for (const m of melds) seen += (m.tiles || []).filter(t => t === tile).length;
        if (game && game.players) {
            for (const p of game.players) {
                seen += (p.discards || []).filter(t => t === tile).length;
                for (const m of (p.melds || [])) {
                    seen += (m.tiles || []).filter(t => t === tile).length;
                }
            }
        }
        return Math.max(0, 4 - seen);
    }

    static namesForTiles(tiles) {
        return tiles.map(t => this.tileName(t));
    }

    static formatDrawList(tiles, max = 8) {
        const names = this.namesForTiles(tiles);
        if (names.length <= max) return names.join('、') || '无';
        return `${names.slice(0, max).join('、')}等${names.length}种`;
    }

    // 生成面向玩家的牌理解释：先比较留下的结构和进张，再给出推荐分。
    static buildDiscardComparison(hand, melds, bestChoice, runnerUp, game) {
        const bestHand = [...hand];
        bestHand.splice(bestHand.indexOf(bestChoice.tile), 1);
        const runnerHand = [...hand];
        runnerHand.splice(runnerHand.indexOf(runnerUp.tile), 1);

        // 直接复用 evalList 里已算好的 drawsInfo（makeDecision 切牌评分时已算过）
        // 避免重复调用 getUsefulDraws（性能优化）；bestChoice.drawsInfo 对应"打掉 bestChoice.tile 后的手牌"
        const bestDraws = bestChoice.drawsInfo;
        const runnerDraws = runnerUp.drawsInfo;
        const bestConnections = this.getTileConnections(hand, bestChoice.tile);
        const runnerConnections = this.getTileConnections(hand, runnerUp.tile);
        const bestName = bestChoice.tileName;
        const runnerName = runnerUp.tileName;

        let html = `<p style="color:#f39c12; font-weight:bold; margin-top:8px; margin-bottom:4px;">🔎 为什么打出 [${bestName}] 比打出 [${runnerName}] 更好？</p>`;

        if (bestConnections.length) {
            html += `<p>• [${bestName}] 当前的牌面关系：<b>${bestConnections.slice(0, 3).join('；')}</b>。打掉它后，上述组合中被拆掉的部分较少，主要保留下来的结构是 <b>${this.describeRemainingStructures(bestHand)}</b>。</p>`;
        } else {
            html += `<p>• [${bestName}] 当前没有形成对子、刻子或明显搭子，属于可以独立处理的牌，打掉不会拆开关键结构。</p>`;
        }

        if (runnerConnections.length) {
            html += `<p>• 相比之下，[${runnerName}] 当前是 <b>${runnerConnections.slice(0, 3).join('；')}</b>；打掉它会直接拆开这组联系，留下 <b>${this.describeRemainingStructures(runnerHand)}</b>。</p>`;
        } else {
            html += `<p>• [${runnerName}] 本身也没有明显组合，因此两者的差异主要看打掉后留下的搭子和后续摸牌路线。</p>`;
        }

        html += `<p>• 打出 [${bestName}] 后，<b>真正能推进手牌的活进张 ${bestChoice.liveCount} 种</b>${bestChoice.liveTiles.length ? `（${this.formatDrawList(bestChoice.liveTiles, 8)}）` : ''}，折算约 <b>${Math.round(bestChoice.shantenWeighted)} 张</b>；名义上可改善的牌 ${bestDraws.useful.length} 种、期望 ${bestDraws.usefulWeighted} 张（已扣除全场已出的牌）；其中可直接成胡的有 <b>${bestDraws.winning.length} 种</b>。</p>`;
        html += `<p>• 打出 [${runnerName}] 后，对应活进张 ${runnerUp.liveCount} 种${runnerUp.liveTiles.length ? `（${this.formatDrawList(runnerUp.liveTiles, 8)}）` : ''}，折算约 ${Math.round(runnerUp.shantenWeighted)} 张；名义上可改善的牌 ${runnerDraws.useful.length} 种、期望 ${runnerDraws.usefulWeighted} 张；其中可直接成胡的有 <b>${runnerDraws.winning.length} 种</b>。</p>`;

        const delta = Math.round(bestChoice.shantenWeighted - runnerUp.shantenWeighted);
        if (delta > 0) {
            html += `<p>• 按含金量折算，打 [${bestName}] 比打 [${runnerName}] 的活进张多 <b>${delta} 张</b>，手牌推进更快。</p>`;
        } else if (delta < 0) {
            html += `<p>• 注意：打 [${bestName}] 的活进张折算反而少 <b>${Math.abs(delta)} 张</b>，所以这次并不是"进张更多就一定更好"；真正的优势在于它保住了更值钱的结构（面子/对子），或这张牌本身更该切。</p>`;
        } else {
            html += `<p>• 两种打法的活进张折算相当，真正的区别在于：打 [${bestName}] 对现有结构的破坏更小，保留下来的面子和对子更完整。</p>`;
        }

        // 推荐分只作为排序结果展示，不再拿它作为牌理解释。
        const scoreDelta = bestChoice.totalEvalScore - runnerUp.totalEvalScore;
        html += `<p style="color:#999;font-size:11px;">📊 算法排序：打 [${bestName}] 的内部推荐分 ${bestChoice.totalEvalScore}，打 [${runnerName}] 为 ${runnerUp.totalEvalScore}，相差 ${scoreDelta >= 0 ? '+' : ''}${scoreDelta}。这个分数只是AI内部排序指标，不等于麻将番数。</p>`;
        return html;
    }

    static describeRemainingStructures(hand) {
        const counts = MahjongEvaluator.getCounts(hand);
        const parts = [];
        const used = new Set();
        for (const t of sortTiles(hand)) {
            if (used.has(t)) continue;
            const p = parseTile(t);
            const c = counts[t] || 0;
            if (c >= 3) {
                parts.push(`${this.tileName(t)}刻子`);
                used.add(t);
                continue;
            }
            if (c === 2) {
                parts.push(`${this.tileName(t)}对子`);
                used.add(t);
                continue;
            }
            if (p.suit !== SUITS.ZHONG && typeof p.num === 'number') {
                const t2 = `${p.num + 1}${p.suit}`;
                const t3 = `${p.num + 2}${p.suit}`;
                if (p.num <= 7 && counts[t2] && counts[t3]) {
                    parts.push(`${this.tileName(t)}${this.tileName(t2)}${this.tileName(t3)}顺子`);
                    used.add(t); used.add(t2); used.add(t3);
                    continue;
                }
                if (p.num <= 8 && counts[t2]) {
                    parts.push(`${this.tileName(t)}${this.tileName(t2)}搭子`);
                    used.add(t); used.add(t2);
                    continue;
                }
                if (p.num <= 7 && counts[t3]) {
                    parts.push(`${this.tileName(t)}${this.tileName(t3)}嵌张搭子`);
                    used.add(t); used.add(t3);
                    continue;
                }
            }
        }
        return parts.slice(0, 4).join('、') || '零散孤张';
    }

    static makeDecision(game, aiIdx, forceDiscard = false) {
        const p = game.players[aiIdx];
        const hand = p.hand;
        const targetStrategy = RobotAI.analyzeHandDirection(hand, p.melds);
        const tingInfo = MahjongEvaluator.getTingInfo(hand, p.melds);

        if (!forceDiscard && !p.justPenged) {
            if (MahjongEvaluator.canSelfDrawHu(hand, p.melds)) {
                return { 
                    action: 'HU', 
                    reason: '符合胡牌牌型，选择胡牌！', 
                    detailHtml: `<div class="log-item"><p style="color:#e74c3c; font-weight:bold;">🏆 决策：自摸胡牌！</p></div>` 
                };
            }

            const counts = MahjongEvaluator.getCounts(hand);
            
            // 暗杠：先评估结构损失，再决定是否杠（暗杠不可被抢，门槛低）
            for (const t in counts) {
                if (counts[t] === 4) {
                    const parsed = parseTile(t);
                    const tileName = parsed.suit === SUITS.ZHONG ? '红中' : `${parsed.num}${parsed.char}`;
                    const gangEval = RobotAI.evaluateGangDecision(game, aiIdx, t, 'angang');
                    if (gangEval.shouldGang) {
                        return { 
                            action: 'GANG', 
                            gangType: 'angang', 
                            tile: t, 
                            reason: gangEval.reason,
                            detailHtml: gangEval.detailHtml
                        };
                    }
                    // 评估为放弃：记录日志，继续走打牌流程（视为4张里有1张当孤张/搭子拆出）
                    p.decisionLogs = p.decisionLogs || [];
                    p.decisionLogs.push(gangEval.detailHtml);
                    break;
                }
            }

            // 补杠：先评估被抢风险，再决定是否杠
            for (const t in counts) {
                if (p.melds.some(m => m.type === 'peng' && m.tiles[0] === t)) {
                    const parsed = parseTile(t);
                    const tileName = parsed.suit === SUITS.ZHONG ? '红中' : `${parsed.num}${parsed.char}`;
                    const gangEval = RobotAI.evaluateGangDecision(game, aiIdx, t, 'bugang');
                    if (gangEval.shouldGang) {
                        return { 
                            action: 'GANG', 
                            gangType: 'bugang', 
                            tile: t, 
                            reason: gangEval.reason,
                            detailHtml: gangEval.detailHtml
                        };
                    }
                    p.decisionLogs = p.decisionLogs || [];
                    p.decisionLogs.push(gangEval.detailHtml);
                    break;
                }
            }
        }

        const uniqueTiles = [...new Set(hand)];
        const counts = MahjongEvaluator.getCounts(hand);
        const evalList = [];

        for (const t of uniqueTiles) {
            const tempHand = [...hand];
            tempHand.splice(tempHand.indexOf(t), 1);
            
            const remainingMeldScore = RobotAI.evaluateHandValue(tempHand, p.melds);
            const nextTing = MahjongEvaluator.getTingInfo(tempHand, p.melds);
            const effectiveTileCount = nextTing.tingTiles.length;
            // ★进张活性改造：活进张（含金量加权）+ 听牌数：让 AI 优先选"打完能真正推进手牌/更接近胡牌"的打法
            // drawsInfo 同时供文案展示用；usefulWeighted 保留为"名义进张"仅作展示，评分用 shantenWeighted
            // 复用 getTingInfo 已算的 tingTiles 作为 winning，避免 getUsefulDraws 重复 28 次 canSelfDrawHu（性能优化）
            const drawsInfo = RobotAI.getUsefulDraws(tempHand, p.melds, game, nextTing.tingTiles);
            const usefulWeighted = drawsInfo.usefulWeighted;
            const winCount = drawsInfo.winning.length;

            // ★进张活性改造：有效进张从"数数量"改为"数含金量"。
            // 逐张检查 useful 牌摸进后结构分提升多少（delta），分三档：
            //   delta>=65  摸进直接成面子/刻子（真进张）→ 权重 1.0
            //   20~64      新增搭子/对子且未被饱和挤掉（半进张）→ 权重 0.35，边张搭子再对折
            //   <20        手牌位置已满，凑出来也用不上（死进张）→ 权重 0
            // 阈值依据结构分表（面子100/对子35/搭子10-18/孤张0-4）校准：
            // 成面子提升实测约 65~100，成搭子/对子约 20~33，饱和死进张 <20
            const SEMI_WEIGHT = 0.35;
            const EDGE_SEMI_WEIGHT = SEMI_WEIGHT / 2;
            let shantenWeighted = 0;
            let liveCount = 0;
            const liveTiles = [];
            for (const d of drawsInfo.useful) {
                const afterScore = RobotAI.evaluateHandValue([...tempHand, d], p.melds);
                const delta = afterScore - remainingMeldScore;
                if (delta >= 65) {
                    liveCount++;
                    liveTiles.push(d);
                    shantenWeighted += RobotAI.countRemaining(game, tempHand, p.melds, d);
                } else if (delta >= 20) {
                    const w = this.isEdgeTatsuDraw(tempHand, d) ? EDGE_SEMI_WEIGHT : SEMI_WEIGHT;
                    shantenWeighted += RobotAI.countRemaining(game, tempHand, p.melds, d) * w;
                }
                // delta < 20：死进张，不计分
            }
            const parsed = parseTile(t);
            const tileName = parsed.suit === SUITS.ZHONG ? '红中' : `${parsed.num}${parsed.char}`;
            
            let discardWeight = 0;
            let tileCategory = "";
            let whyCutReason = ""; 

            if (parsed.suit === SUITS.ZHONG) {
                discardWeight = 35; 
                tileCategory = "红中孤张";
                whyCutReason = "字牌红中无法与数牌组顺子，单张留着没有任何靠张价值，最优先切出。";
            } else {
                const n = parsed.num;
                const s = parsed.suit;
                const hasN1 = hand.includes(`${n-1}${s}`);
                const hasP1 = hand.includes(`${n+1}${s}`);
                const hasN2 = hand.includes(`${n-2}${s}`);
                const hasP2 = hand.includes(`${n+2}${s}`);
                const isIsolated = !hasN1 && !hasP1 && !hasN2 && !hasP2;

                if (counts[t] === 1) {
                    if (isIsolated) {
                        if (n === 1 || n === 9) {
                            discardWeight = 25; 
                            tileCategory = "1/9边张孤张";
                            whyCutReason = `[${tileName}] 属于1/9极端边张孤牌，无邻牌联络，摸进靠张概率极低，打掉完全不伤手牌结构。`;
                        } else if (n === 2 || n === 8) {
                            discardWeight = 18; 
                            tileCategory = "2/8次边孤张";
                            whyCutReason = `[${tileName}] 属于2/8次边孤牌，靠张效率明显低于中张，优先打出。`;
                        } else {
                            discardWeight = 8; 
                            tileCategory = "3~7中张孤牌";
                            whyCutReason = `[${tileName}] 是无相邻搭子的孤立中张，因没有更高优先级的字牌/边张，故切出。`;
                        }
                    } else {
                        discardWeight = 2; 
                        tileCategory = "搭子/联络牌";
                        whyCutReason = `[${tileName}] 与邻牌构成了搭子，打出会略微损伤进张组合。`;
                    }
                } else if (counts[t] === 2) {
                    discardWeight = -25; 
                    tileCategory = "对子牌 (雀头/碰牌)";
                    whyCutReason = `[${tileName}] 属于重要对子，切掉会损失雀头或碰牌机会。`;
                } else {
                    discardWeight = -60; 
                    tileCategory = "成型刻子";
                    whyCutReason = `[${tileName}] 已三张成刻，属于核心固定牌型，极不建议打出。`;
                }
            }

            // ★进张活性改造：评分公式（进张项由名义进张 usefulWeighted 改为含金量加权的 shantenWeighted）
            // - 结构分×10：保留原权重，是基础
            // - shantenWeighted×15：只给真正能推进手牌的进张记分（中盘主要驱动力）
            // - 听牌数×50：接近胡牌时主导（听牌比进张重要得多）
            const totalEvalScore = remainingMeldScore * 10 + discardWeight + shantenWeighted * 15 + winCount * 50;

            evalList.push({
                tile: t,
                tileName,
                count: counts[t],
                remainingMeldScore,
                effectiveTileCount,
                usefulWeighted,
                shantenWeighted,
                liveCount,
                liveTiles,
                winCount,
                drawsInfo,
                discardWeight,
                totalEvalScore,
                tileCategory,
                whyCutReason
            });
        }

        evalList.sort((a, b) => b.totalEvalScore - a.totalEvalScore);
        RobotAI.lastEvalList = evalList; // ★进张活性改造：调试/测试用快照，不影响任何游戏逻辑
        const bestChoice = evalList[0];

        // 构造易懂、逻辑自洽的思考日志 HTML
        let detailHtml = `<div class="log-item">`;
        detailHtml += `<p style="color:var(--accent-gold); font-weight:bold; font-size:14px;">🎯 战术定位：${targetStrategy.name}</p>`;
        detailHtml += `<p style="font-size:12px; color:#bbb; margin-bottom:6px;">💡 定位分析：${targetStrategy.reason}</p>`;
        
        if (tingInfo.isTing) {
            const tingNames = tingInfo.tingTiles.map(t => {
                const tp = parseTile(t);
                return tp.suit === SUITS.ZHONG ? '红中' : `${tp.num}${tp.char}`;
            }).join('、');
            detailHtml += `<p style="color:#2ecc71; font-weight:bold; font-size:13px; margin-bottom:6px;">⚡ 已听牌！叫牌：[ ${tingNames} ]</p>`;
        }

        detailHtml += `<p style="margin-bottom:6px; font-weight:bold;">🤖 出牌决定：打出 <span style="color:var(--accent-gold); font-size:15px;">[${bestChoice.tileName}]</span> (${bestChoice.tileCategory})</p>`;
        
        detailHtml += `<div style="background:rgba(255,255,255,0.05); padding:8px; border-radius:6px; margin-bottom:8px;">`;
        detailHtml += `<p style="color:#e74c3c; font-weight:bold; margin-bottom:4px;">❓ 为什么优先选择打出 [${bestChoice.tileName}]？</p>`;
        detailHtml += `<p style="color:#eee; font-size:12px;">• ${bestChoice.whyCutReason}</p>`;

        if (evalList.length > 1) {
            const runnerUp = evalList[1];
            detailHtml += this.buildDiscardComparison(hand, p.melds, bestChoice, runnerUp, game);
        }
        detailHtml += `</div>`;

        detailHtml += `<p style="margin-bottom:4px; color:#bdc3c7; font-size:12px;"><b>📋 主要候选牌对比：</b> <span style="color:#888;">推荐分用于排序，牌面依据用于解释为什么。</span></p>`;
        detailHtml += `<table class="decision-table" style="width:100%; border-collapse:collapse; font-size:11px; text-align:center;">`;
        detailHtml += `<tr style="background:rgba(255,255,255,0.1); color:var(--accent-gold);">
                        <th style="padding:3px;">候选牌</th>
                        <th style="padding:3px;">推荐分</th>
                        <th style="padding:3px;">牌面依据</th>
                        <th style="padding:3px;">打后活进张</th>
                       </tr>`;
        
        evalList.forEach((item, idx) => {
            if (idx < 5) {
                const isSelected = idx === 0;
                const rowBg = isSelected ? 'background:rgba(241,196,15,0.25); font-weight:bold;' : '';
                detailHtml += `<tr style="${rowBg} border-bottom:1px dashed rgba(255,255,255,0.1);">
                                <td style="padding:3px; color:${isSelected ? '#2ecc71' : '#fff'};">[${item.tileName}] ${isSelected ? '✅' : ''}</td>
                                <td class="score" style="padding:3px; color:var(--accent-gold);">${item.totalEvalScore}</td>
                                <td style="padding:3px; text-align:left;">${this.getTileConnections(hand, item.tile).slice(0, 3).join('；') || '孤张/无明显组合'}</td>
                                <td style="padding:3px; color:#2ecc71; font-size:11px;">${item.liveCount ? this.formatDrawList(item.liveTiles, 5) : '无活进张'}<br><span style="color:#888;">活${item.liveCount}种/折算${Math.round(item.shantenWeighted)}张·名义${item.drawsInfo.usefulWeighted}张${item.winCount ? `/听${item.winCount}种` : ''}</span></td>
                               </tr>`;
            }
        });
        detailHtml += `</table>`;
        detailHtml += `</div>`;

        return { 
            action: 'DISCARD', 
            tile: bestChoice.tile, 
            reason: `打出 ${bestChoice.tileCategory} [${bestChoice.tileName}]`,
            detailHtml
        };
    }
}

class SoundSystem {
    constructor() {
        this.enabled = true;
        this.ctx = null;
        this.voice = null;
        this.keepAlive = null;
        this.initVoices();
        this.bindUnlock();
    }

    // Safari/iOS 修复①: 首次用户手势立即解锁并预热音频，不再等第一次游戏音效时才懒创建
    bindUnlock() {
        const unlock = () => {
            this.init();
        };
        ['pointerdown', 'touchend', 'keydown'].forEach(ev =>
            window.addEventListener(ev, unlock, { passive: true, capture: true }));
        // iOS 切后台/打断后恢复
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) this.init();
        });
        window.addEventListener('pageshow', () => this.init());
    }

    // Safari/iOS 修复②: 零增益保活振荡器，防止 Safari 音频渲染线程休眠
    // （休眠后第一声提示音要等线程唤醒，正是"提示音晚一点"的主因；Chrome 无此行为）
    startKeepAlive() {
        if (this.keepAlive || !this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            g.gain.value = 0;
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start();
            this.keepAlive = osc;
        } catch (e) {}
    }

    initVoices() {
        if ('speechSynthesis' in window) {
            const loadVoices = () => {
                const voices = window.speechSynthesis.getVoices();
                if (voices && voices.length > 0) {
                    this.voice = voices.find(v => v.lang && (
                        v.lang.includes('zh') || 
                        v.lang.includes('CN') || 
                        v.lang.includes('cmn') ||
                        v.lang.toLowerCase().includes('chinese')
                    )) || voices[0] || null;
                }
            };
            loadVoices();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = loadVoices;
            }
        }
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                this.ctx = new AudioCtx();
                // 修复③: 兼容 iOS 特有的 interrupted 状态——任何非 running 状态都尝试恢复
                this.ctx.onstatechange = () => {
                    if (this.ctx.state === 'running') this.startKeepAlive();
                };
            }
        }
        if (this.ctx && this.ctx.state !== 'running') {
            try {
                const p = this.ctx.resume();
                if (p && p.catch) p.catch(() => {});
            } catch (e) {}
        }
        if (this.ctx && this.ctx.state === 'running') this.startKeepAlive();
        if ('speechSynthesis' in window) {
            try { window.speechSynthesis.resume(); } catch (e) {}
        }
    }

    playTone(freq, duration, type = 'sine', gainVal = 0.1) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            // 修复④: 调度到当前渲染量子之后(+10ms)，避免 Safari 把音符排在已过去的时间点上被吞/延后
            const t0 = this.ctx.currentTime + 0.01;
            osc.frequency.setValueAtTime(freq, t0);
            gain.gain.setValueAtTime(gainVal, t0);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t0);
            osc.stop(t0 + duration);
        } catch(e) {}
    }

    playDraw() { this.playTone(440, 0.08, 'triangle', 0.15); }
    playDiscard(tileStr) { 
        this.playTone(220, 0.12, 'square', 0.12);
        this.speakTile(tileStr);
    }
    playPeng() { 
        this.playTone(587.33, 0.2, 'sine', 0.2); 
        this.speakPhrase("碰");
    }
    
    playGang(gangType = 'zhigang') { 
        this.playTone(659.25, 0.25, 'sine', 0.25); 
        if (gangType === 'angang') {
            this.speakPhrase("暗杠");
        } else if (gangType === 'bugang') {
            this.speakPhrase("补杠");
        } else {
            this.speakPhrase("直杠");
        }
    }

    playHu(handTypeName = "胡牌啦") {
        this.playTone(523.25, 0.15, 'triangle', 0.3);
        setTimeout(() => this.playTone(659.25, 0.15, 'triangle', 0.3), 150);
        setTimeout(() => this.playTone(783.99, 0.3, 'triangle', 0.4), 300);
        this.speakPhrase(handTypeName);
    }

    speakPhrase(phrase) {
        if (!this.enabled || !phrase) return;
        this.init();
        if ('speechSynthesis' in window) {
            try {
                window.speechSynthesis.resume();
                const utterance = new SpeechSynthesisUtterance(phrase);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.15;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                
                if (!this.voice) {
                    const voices = window.speechSynthesis.getVoices();
                    this.voice = voices.find(v => v.lang && (v.lang.includes('zh') || v.lang.includes('CN') || v.lang.includes('cmn'))) || voices[0] || null;
                }
                if (this.voice) utterance.voice = this.voice;
                
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.warn("Speech synthesis notice:", e);
            }
        }
    }

    speakTile(tileStr) {
        if (!this.enabled || !tileStr) return;
        const t = parseTile(tileStr);
        let text = "";
        if (t.suit === SUITS.ZHONG) text = "红中";
        else {
            const suitMap = { 'wan': '万', 'tong': '筒', 'tiao': '条' };
            text = `${t.num}${suitMap[t.suit] || ''}`;
        }
        this.speakPhrase(text);
    }
}
const sound = new SoundSystem();

class MahjongGame {
    constructor() {
        this.stake = 5;
        this.score = 0;
        this.players = [
            { name: '我自己 (南)', score: 0, hand: [], melds: [], discards: [], justPenged: false, decisionLogs: [] },
            { name: '机器人1 (东)', score: 0, hand: [], melds: [], discards: [], justPenged: false, decisionLogs: [] },
            { name: '机器人2 (北)', score: 0, hand: [], melds: [], discards: [], justPenged: false, decisionLogs: [] },
            { name: '机器人3 (西)', score: 0, hand: [], melds: [], discards: [], justPenged: false, decisionLogs: [] }
        ];
        this.dealer = 0;
        this.turn = 0;
        this.deck = [];
        this.gameState = 'IDLE';
        this.mode = 'real'; // 默认实战模式（盲打）
        this.showAITiles = false;
        this.selectedTileIndex = -1;
        this.lastDiscard = null;
        this.lastDiscarder = -1;
        this.currentRoundGangs = [];
        this.isFirstDiscard = false;
        this.pendingQiangGang = null;
        this.loadStorage();
    }

    loadStorage() {
        try {
            const saved = localStorage.getItem('mahjong_scores_v3');
            if (saved !== null) {
                const scores = JSON.parse(saved);
                if (Array.isArray(scores) && scores.length === 4) {
                    this.players.forEach((p, i) => p.score = scores[i] || 0);
                    this.score = this.players[0].score;
                }
            }
        } catch(e) {}
    }

    saveStorage() {
        try {
            const scores = this.players.map(p => p.score);
            localStorage.setItem('mahjong_scores_v3', JSON.stringify(scores));
        } catch(e) {}
    }

    resetScore() {
        this.players.forEach(p => p.score = 0);
        this.score = 0;
        localStorage.removeItem('mahjong_scores_v3');
        this.saveStorage();
        this.updateUI();
    }

    announceAction(text) {
        const el = document.getElementById('actionAnnouncement');
        if (!el) return;
        el.innerText = text;
        el.style.display = 'block';
        clearTimeout(this.announceTimer);
        this.announceTimer = setTimeout(() => {
            el.style.display = 'none';
        }, AI_TIMING.announceHold);
    }

    // ★修正③：思考一结束就撤下提示。
    // 原本 announceAction 挂的是固定 5 秒定时器，而 AI 实际只思考 AI_TIMING.think(800ms)，
    // 导致"轮到我出牌"时中央还挂着"机器人X 深度思考中"，要干等到 5 秒。
    // matchText 用于防止误清：若当前公告已被别的公告（碰/杠/胡）替换，则保持不动。
    clearAnnouncement(matchText) {
        const el = document.getElementById('actionAnnouncement');
